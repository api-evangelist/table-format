aid: table-format
name: Table Format
description: >-
  Open Table Format is a category of open standards for organizing and managing data in data lakehouses. The three
  dominant formats are Apache Iceberg (the emerging industry standard with snapshot-based metadata and broad engine
  support), Delta Lake (Databricks-originated, transaction-log-based), and Apache Hudi (upsert-optimized with
  Copy-on-Write and Merge-on-Read modes). These formats bring ACID transactions, schema evolution, time travel, and
  efficient query planning to data lake storage. Apache Iceberg defines a REST Catalog API (OpenAPI spec) that enables
  standardized catalog operations across implementations like Polaris, Nessie, AWS Glue, and Google BigLake.
