apis:
- aid: table-format:delta-lake
  name: Delta Lake
  description: >-
    Delta Lake is an open-source storage framework developed by Databricks that adds reliability, performance,
    and ACID compliance to data lakes. It uses a transaction log (delta log) to record all changes to
    data. Delta Lake is deeply integrated with Apache Spark and supports batch and streaming workloads,
    schema enforcement, time travel, and MERGE operations.
  humanURL: https://delta.io/
  tags:
  - Delta Lake
  - Data Lake
  - ACID Transactions
  - Apache Spark
  - Databricks
  properties:
  - type: Documentation
    url: https://docs.delta.io/
  - type: GitHub
    url: https://github.com/delta-io/delta
- aid: table-format:apache-hudi
  name: Apache Hudi
  description: >-
    Apache Hudi (Hadoop Upserts Deletes and Incrementals) is an open-source data lakehouse platform optimized
    for upserts, deletes, and incremental data processing. It supports Copy-on-Write (COW) and Merge-on-Read
    (MOR) table types and is used for CDC-based data pipelines and streaming analytics.
  humanURL: https://hudi.apache.org/
  tags:
  - Apache Hudi
  - Data Lake
  - CDC
  - Incremental Processing
  properties:
  - type: Documentation
    url: https://hudi.apache.org/docs/overview/
  - type: GitHub
    url: https://github.com/apache/hudi
