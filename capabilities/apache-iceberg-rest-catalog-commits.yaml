naftiko: 1.0.0-alpha2
info:
  label: Apache Iceberg REST Catalog API — Commits
  description: 'Apache Iceberg REST Catalog API — Commits. 1 operations. Lead operation: Commit Multi-Table Transaction. Self-contained
    Naftiko capability covering one Table Format business surface.'
  tags:
  - Table Format
  - Commits
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TABLE_FORMAT_API_KEY: TABLE_FORMAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: apache-iceberg-rest-catalog-commits
    baseUri: https://{catalog-host}
    description: Apache Iceberg REST Catalog API — Commits business capability. Self-contained, no shared references.
    resources:
    - name: v1-transactions-commit
      path: /v1/transactions/commit
      operations:
      - name: committransaction
        method: POST
        description: Commit Multi-Table Transaction
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TABLE_FORMAT_API_KEY}}'
  exposes:
  - type: rest
    namespace: apache-iceberg-rest-catalog-commits-rest
    port: 8080
    description: REST adapter for Apache Iceberg REST Catalog API — Commits. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v1/transactions/commit
      name: v1-transactions-commit
      description: REST surface for v1-transactions-commit.
      operations:
      - method: POST
        name: committransaction
        description: Commit Multi-Table Transaction
        call: apache-iceberg-rest-catalog-commits.committransaction
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apache-iceberg-rest-catalog-commits-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache Iceberg REST Catalog API — Commits. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: commit-multi-table-transaction
      description: Commit Multi-Table Transaction
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: apache-iceberg-rest-catalog-commits.committransaction
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
