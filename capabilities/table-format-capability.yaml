naftiko: 1.0.0-alpha2
info:
  label: Apache Iceberg REST Catalog API
  description: The Apache Iceberg REST Catalog API is an open standard (OpenAPI spec) for interacting with Apache Iceberg
    table catalogs. It provides a common HTTP interface for catalog operations including namespace management, table lifecycle,
    view management, and metadata operations. Multiple catalog implementations support this specification including Apache
    Polaris, Project Nessie, AWS Glue, and Google BigLake.
  tags:
  - Table
  - Format
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: table-format
    baseUri: https://localhost:8181
    description: Apache Iceberg REST Catalog API HTTP API.
    authentication:
      type: bearer
      token: '{{TABLE_FORMAT_TOKEN}}'
    resources:
    - name: v1-config
      path: /v1/config
      operations:
      - name: getconfig
        method: GET
        description: Get Catalog Configuration
        inputParameters:
        - name: warehouse
          in: query
          type: string
          description: Warehouse identifier for multi-tenant catalogs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-oauth-tokens
      path: /v1/oauth/tokens
      operations:
      - name: gettoken
        method: POST
        description: Get OAuth2 Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-namespaces
      path: /v1/namespaces
      operations:
      - name: listnamespaces
        method: GET
        description: List Namespaces
        inputParameters:
        - name: parent
          in: query
          type: string
          description: Parent namespace (for nested namespaces)
        - name: pageToken
          in: query
          type: string
        - name: pageSize
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createnamespace
        method: POST
        description: Create Namespace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-namespaces-namespace
      path: /v1/namespaces/{namespace}
      operations:
      - name: loadnamespacemetadata
        method: GET
        description: Get Namespace Metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: dropnamespace
        method: DELETE
        description: Drop Namespace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-namespaces-namespace-properties
      path: /v1/namespaces/{namespace}/properties
      operations:
      - name: updatenamespaceproperties
        method: POST
        description: Update Namespace Properties
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-namespaces-namespace-tables
      path: /v1/namespaces/{namespace}/tables
      operations:
      - name: listtables
        method: GET
        description: List Tables
        inputParameters:
        - name: pageToken
          in: query
          type: string
        - name: pageSize
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createtable
        method: POST
        description: Create Table
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-namespaces-namespace-tables-table
      path: /v1/namespaces/{namespace}/tables/{table}
      operations:
      - name: loadtable
        method: GET
        description: Load Table
        inputParameters:
        - name: snapshots
          in: query
          type: string
          description: Which snapshots to return (all, refs, or none)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: committable
        method: POST
        description: Commit Table Update
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: droptable
        method: DELETE
        description: Drop Table
        inputParameters:
        - name: purgeRequested
          in: query
          type: boolean
          description: Whether to purge table data files
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-namespaces-namespace-tables-table-metrics
      path: /v1/namespaces/{namespace}/tables/{table}/metrics
      operations:
      - name: reportmetrics
        method: POST
        description: Report Table Metrics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-namespaces-namespace-views
      path: /v1/namespaces/{namespace}/views
      operations:
      - name: listviews
        method: GET
        description: List Views
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createview
        method: POST
        description: Create View
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-namespaces-namespace-views-view
      path: /v1/namespaces/{namespace}/views/{view}
      operations:
      - name: loadview
        method: GET
        description: Load View
        inputParameters:
        - name: view
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: dropview
        method: DELETE
        description: Drop View
        inputParameters:
        - name: view
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-transactions-commit
      path: /v1/transactions/commit
      operations:
      - name: committransaction
        method: POST
        description: Commit Multi-Table Transaction
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
