          mapping: $.
    - path: /v1/namespaces/{namespace}
      name: dropnamespace
      operations:
      - method: DELETE
        name: dropnamespace
        description: Drop Namespace
        call: table-format.dropnamespace
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/namespaces/{namespace}/properties
      name: updatenamespaceproperties
      operations:
      - method: POST
        name: updatenamespaceproperties
        description: Update Namespace Properties
        call: table-format.updatenamespaceproperties
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/namespaces/{namespace}/tables
      name: listtables
      operations:
      - method: GET
        name: listtables
        description: List Tables
        call: table-format.listtables
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/namespaces/{namespace}/tables
      name: createtable
      operations:
      - method: POST
        name: createtable
        description: Create Table
        call: table-format.createtable
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/namespaces/{namespace}/tables/{table}
      name: loadtable
      operations:
      - method: GET
        name: loadtable
        description: Load Table
        call: table-format.loadtable
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/namespaces/{namespace}/tables/{table}
      name: committable
      operations:
      - method: POST
        name: committable
        description: Commit Table Update
        call: table-format.committable
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/namespaces/{namespace}/tables/{table}
      name: droptable
      operations:
      - method: DELETE
        name: droptable
        description: Drop Table
        call: table-format.droptable
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/namespaces/{namespace}/tables/{table}/metrics
      name: reportmetrics
      operations:
      - method: POST
        name: reportmetrics
        description: Report Table Metrics
        call: table-format.reportmetrics
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/namespaces/{namespace}/views
      name: listviews
      operations:
      - method: GET
        name: listviews
        description: List Views
        call: table-format.listviews
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/namespaces/{namespace}/views
      name: createview
      operations:
      - method: POST
        name: createview
        description: Create View
        call: table-format.createview
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/namespaces/{namespace}/views/{view}
      name: loadview
      operations:
      - method: GET
        name: loadview
        description: Load View
        call: table-format.loadview
        with:
          view: rest.view
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/namespaces/{namespace}/views/{view}
      name: dropview
      operations:
      - method: DELETE
        name: dropview
        description: Drop View
        call: table-format.dropview
        with:
          view: rest.view
        outputParameters:
