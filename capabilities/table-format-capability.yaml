          mapping: $.
    - path: /v1/transactions/commit
      name: committransaction
      operations:
      - method: POST
        name: committransaction
        description: Commit Multi-Table Transaction
        call: table-format.committransaction
        outputParameters:
        - type: object
          mapping: $.
