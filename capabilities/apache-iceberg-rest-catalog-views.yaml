  - type: http
    namespace: apache-iceberg-rest-catalog-views
    baseUri: https://{catalog-host}
    description: Apache Iceberg REST Catalog API — Views business capability. Self-contained, no shared references.
    resources:
    - name: v1-namespaces-namespace-views
      path: /v1/namespaces/{namespace}/views
      operations:
      - name: listviews
        method: GET
        description: List Views
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createview
        method: POST
        description: Create View
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-namespaces-namespace-views-view
      path: /v1/namespaces/{namespace}/views/{view}
      operations:
      - name: loadview
        method: GET
        description: Load View
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: view
          in: path
          type: string
          required: true
      - name: dropview
        method: DELETE
        description: Drop View
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: view
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.TABLE_FORMAT_API_KEY}}'
  exposes:
  - type: rest
    namespace: apache-iceberg-rest-catalog-views-rest
    port: 8080
    description: REST adapter for Apache Iceberg REST Catalog API — Views. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/namespaces/{namespace}/views
      name: v1-namespaces-namespace-views
      description: REST surface for v1-namespaces-namespace-views.
      operations:
      - method: GET
        name: listviews
        description: List Views
        call: apache-iceberg-rest-catalog-views.listviews
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createview
        description: Create View
        call: apache-iceberg-rest-catalog-views.createview
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/namespaces/{namespace}/views/{view}
      name: v1-namespaces-namespace-views-view
      description: REST surface for v1-namespaces-namespace-views-view.
      operations:
      - method: GET
        name: loadview
        description: Load View
        call: apache-iceberg-rest-catalog-views.loadview
        with:
          view: rest.view
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: dropview
        description: Drop View
        call: apache-iceberg-rest-catalog-views.dropview
        with:
          view: rest.view
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apache-iceberg-rest-catalog-views-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache Iceberg REST Catalog API — Views. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-views
      description: List Views
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apache-iceberg-rest-catalog-views.listviews
      outputParameters:
      - type: object
        mapping: $.
    - name: create-view
      description: Create View
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: apache-iceberg-rest-catalog-views.createview
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: load-view
      description: Load View
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: apache-iceberg-rest-catalog-views.loadview
      with:
        view: tools.view
      outputParameters:
      - type: object
        mapping: $.
    - name: drop-view
      description: Drop View
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: apache-iceberg-rest-catalog-views.dropview
      with:
        view: tools.view
      outputParameters:
      - type: object
        mapping: $.
